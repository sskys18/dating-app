name: DatingApp
options:
  bundleIdPrefix: com.datingapp
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  DatingApp:
    type: application
    platform: iOS
    sources:
      - path: DatingApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.datingapp.app
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Dating App
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: Add photos to your dating profile.
        INFOPLIST_KEY_NSCameraUsageDescription: Take a photo for your dating profile.
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: Show people near you.
    entitlements:
      path: DatingApp/DatingApp.entitlements
      properties:
        com.apple.developer.applesignin:
          - Default
        # Replace the placeholder host with the real app domain before shipping.
        com.apple.developer.associated-domains:
          - applinks:datingapp.example.com
        aps-environment: development
